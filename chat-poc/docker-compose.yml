version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ycyw_postgres
    environment:
      POSTGRES_DB: ycyw_chat
      POSTGRES_USER: ycyw
      POSTGRES_PASSWORD: ycyw_secret
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ycyw -d ycyw_chat']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ycyw_redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
